{% extends "base.html" %}
{% block title %}教师后台 — 弦歌{% endblock %}
{% block content %}

<div class="login-page">
    <h1 class="page-title">教师后台</h1>
    <p class="page-subtitle">使用注册邮箱登录，管理试课申请</p>
    <form class="login-form" method="POST">
        <div class="form-group">
            <label for="email">注册邮箱</label>
            <input type="email" id="email" name="email" required placeholder="请输入注册时的邮箱">
        </div>
        <button type="submit" class="btn btn-primary btn-large">进入后台</button>
        <p class="login-hint">还没有注册？<a href="/register">立即注册</a></p>
    </form>
</div>

{% endblock %}
