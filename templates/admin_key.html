{% extends "base.html" %}{% block title %}安全验证{% endblock %}{% block content %}
<div class="login-page"><h1 class="page-title">🔑 安全密钥</h1>
<form class="login-form" method="POST">
    <p style="text-align:center;font-size:.9rem;color:var(--text2);margin-bottom:16px">请输入安全密钥以完成登录</p>
    <div class="form-group"><label>安全密钥</label><input type="password" name="key" required placeholder="输入密钥" maxlength="10" style="font-size:1.2rem;letter-spacing:6px;text-align:center"></div>
    <button type="submit" class="btn btn-primary btn-large" style="width:100%">验证</button>
</form></div>{% endblock %}
