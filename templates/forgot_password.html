{% extends "base.html" %}{% block title %}忘记密码{% endblock %}{% block content %}
<div class="login-page">
    <h1 class="page-title">忘记密码</h1>
    <form class="login-form" method="POST">
        <input type="hidden" name="step" value="{% if step=='verify' %}verify{% elif step=='reset' %}reset{% else %}send{% endif %}">
        
        {% if step == 'phone' or step == 'send' %}
        <div class="form-group"><label>手机号</label>
            <input type="tel" name="phone" value="{{ phone or '' }}" required placeholder="请输入注册手机号">
        </div>
        <div class="form-group"><label>账号类型</label>
            <select name="role"><option value="teacher" {% if role=='teacher' %}selected{% endif %}>老师</option><option value="parent" {% if role=='parent' %}selected{% endif %}>家长</option></select>
        </div>
        <button type="submit" class="btn btn-primary">发送验证码</button>
        
        {% elif step == 'verify' %}
        <input type="hidden" name="phone" value="{{ phone }}">
        <input type="hidden" name="role" value="{{ role }}">
        <input type="hidden" name="step" value="verify">
        <p style="text-align:center;font-size:.9rem;color:var(--text2);margin-bottom:16px">验证码已发送到 {{ phone[:3] }}****{{ phone[-4:] }}</p>
        <div class="form-group"><label>验证码</label>
            <input type="text" name="code" required placeholder="输入6位验证码" maxlength="6">
        </div>
        <button type="submit" class="btn btn-primary">验证</button>
        
        {% elif step == 'reset' %}
        <input type="hidden" name="phone" value="{{ phone }}">
        <input type="hidden" name="role" value="{{ role }}">
        <input type="hidden" name="step" value="reset">
        <div class="form-group"><label>新密码</label>
            <input type="password" name="new_password" required minlength="4" placeholder="至少4位">
        </div>
        <button type="submit" class="btn btn-primary">重置密码</button>
        {% endif %}
        
        <p class="login-hint"><a href="/login">返回登录</a></p>
    </form>
</div>{% endblock %}
