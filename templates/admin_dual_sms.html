{% extends "base.html" %}{% block title %}双人验证{% endblock %}{% block content %}
<div class="login-page"><h1 class="page-title">🔐 双人短信验证</h1>
<form class="login-form" method="POST">
    <p style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:16px">需要两位管理员的验证码才能登录</p>
    {% if test_code1 and test_code2 %}
    <div style="background:#f8f6ff;border:1px solid #e8e4ff;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center;font-size:.85rem">
        测试验证码: 胖～<strong style="color:var(--primary)">{{ test_code1 }}</strong> 鱼饼<strong style="color:var(--primary)">{{ test_code2 }}</strong>
    </div>
    {% endif %}
    <div class="form-group"><label>胖～的验证码</label><input type="text" name="code1" required placeholder="胖～的验证码" maxlength="6" style="font-size:1.1rem;letter-spacing:4px;text-align:center"></div>
    <div class="form-group"><label>鱼饼的验证码</label><input type="text" name="code2" required placeholder="鱼饼的验证码" maxlength="6" style="font-size:1.1rem;letter-spacing:4px;text-align:center"></div>
    <button type="submit" class="btn btn-primary btn-large" style="width:100%">验证</button>
</form></div>{% endblock %}
