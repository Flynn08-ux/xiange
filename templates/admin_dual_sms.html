{% extends "base.html" %}{% block title %}双人验证{% endblock %}{% block content %}
<div class="login-page"><h1 class="page-title">🔐 双人短信验证</h1>
<form class="login-form" method="POST">
    <p style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:16px">需要两位管理员的验证码才能登录超级管理员账号</p>
    <div class="form-group"><label>胖～的验证码（已发送到 {{ phone1[:3] }}****{{ phone1[-4:] }}）</label>
        <input type="text" name="code1" required placeholder="输入胖～的验证码" maxlength="6" style="font-size:1.2rem;letter-spacing:4px;text-align:center"></div>
    <div class="form-group"><label>鱼饼的验证码（已发送到 {{ phone2[:3] }}****{{ phone2[-4:] }}）</label>
        <input type="text" name="code2" required placeholder="输入鱼饼的验证码" maxlength="6" style="font-size:1.2rem;letter-spacing:4px;text-align:center"></div>
    <button type="submit" class="btn btn-primary btn-large" style="width:100%">验证并登录</button>
</form></div>{% endblock %}
