{% extends "base.html" %}{% block title %}管理员登录{% endblock %}{% block content %}
<div class="login-page"><h1 class="page-title">管理员登录</h1>
<form class="login-form" id="loginForm">
    <div class="form-group"><label>用户名</label><input type="text" name="username" id="loginUser" required></div>
    <div class="form-group"><label>密码</label><input type="password" name="password" required></div>
    <div class="form-group"><label>图形验证码</label>
        <div style="display:flex;gap:8px;align-items:center">
            <input type="text" name="captcha" required placeholder="输入验证码" style="flex:1">
            <img src="/admin/captcha" alt="验证码" id="captchaImg" onclick="this.src='/admin/captcha?'+Date.now()" style="cursor:pointer;border-radius:8px;height:40px">
        </div>
        <p style="font-size:.72rem;color:var(--text2);margin-top:4px">点击图片刷新验证码</p>
    </div>
    <button type="submit" class="btn btn-primary btn-large" style="width:100%">登录</button>
    <div id="formError" style="color:var(--error);font-size:.85rem;margin-top:8px;text-align:center;display:none"></div>
</form></div>

<div id="smsModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center">
<div style="background:#fff;padding:32px;border-radius:16px;max-width:420px;width:90%;margin:20vh auto 0;box-shadow:0 8px 40px rgba(0,0,0,0.15)">
    <h2 style="margin-bottom:8px;font-size:1.2rem">🔐 请输入短信验证码</h2>
    <p id="smsMsg" style="font-size:.85rem;color:var(--text2);margin-bottom:16px"></p>
    <div id="smsInputs"></div>
    <div id="smsError" style="color:var(--error);font-size:.82rem;margin-bottom:8px;display:none"></div>
    <button onclick="verifySms()" class="btn btn-primary btn-large" style="width:100%" id="smsBtn">验证</button>
    <p style="text-align:center;margin-top:12px"><a href="#" onclick="closeSms();return false">取消</a></p>
</div></div>

<style>
#smsModal.show{display:flex}
#smsModal input:focus{outline:2px solid var(--primary);outline-offset:2px}
</style>

<script>
const form = document.getElementById('loginForm');
const captchaImg = document.getElementById('captchaImg');

form.onsubmit = async function(e) {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = '登录中...';
    document.getElementById('formError').style.display = 'none';
    
    const fd = new FormData(form);
    const resp = await fetch('/admin/login', {
        method:'POST', headers:{'X-Requested-With':'XMLHttpRequest'}, body:fd
    });
    const d = await resp.json();
    
    if (d.status === 'sms_required') {
        document.getElementById('smsMsg').textContent = d.msg || '验证码已发送';
        document.getElementById('smsInputs').innerHTML = '<input type="text" id="smsCode" required placeholder="输入6位验证码" maxlength="6" style="font-size:1.2rem;letter-spacing:4px;text-align:center;width:100%;padding:12px;border:2px solid var(--border);border-radius:10px">';
        document.getElementById('smsError').style.display = 'none';
        document.getElementById('smsModal').classList.add('show');
        window._smsType = 'single';
        btn.disabled = false; btn.textContent = '登录';
        setTimeout(()=>document.getElementById('smsCode').focus(), 200);
    }
    else if (d.status === 'dual_sms_required') {
        document.getElementById('smsMsg').textContent = '需要胖～和鱼饼两人的验证码';
        document.getElementById('smsInputs').innerHTML = 
            '<div style="margin-bottom:12px"><label style="font-size:.82rem;color:var(--text2);display:block;margin-bottom:4px">胖～的验证码</label><input type="text" id="code1" required placeholder="胖～的验证码" maxlength="6" style="font-size:1.1rem;letter-spacing:4px;text-align:center;width:100%;padding:10px;border:2px solid var(--border);border-radius:10px"></div>' +
            '<div style="margin-bottom:8px"><label style="font-size:.82rem;color:var(--text2);display:block;margin-bottom:4px">鱼饼的验证码</label><input type="text" id="code2" required placeholder="鱼饼的验证码" maxlength="6" style="font-size:1.1rem;letter-spacing:4px;text-align:center;width:100%;padding:10px;border:2px solid var(--border);border-radius:10px"></div>';
        document.getElementById('smsError').style.display = 'none';
        document.getElementById('smsModal').classList.add('show');
        window._smsType = 'dual';
        btn.disabled = false; btn.textContent = '登录';
        setTimeout(()=>document.getElementById('code1').focus(), 200);
    }
    else {
        document.getElementById('formError').textContent = d.message || '登录失败';
        document.getElementById('formError').style.display = 'block';
        captchaImg.src = '/admin/captcha?'+Date.now();
        form.querySelector('[name="captcha"]').value = '';
        btn.disabled = false; btn.textContent = '登录';
    }
};

async function verifySms() {
    const btn = document.getElementById('smsBtn');
    btn.disabled = true; btn.textContent = '验证中...';
    document.getElementById('smsError').style.display = 'none';
    
    const fd = new FormData();
    let url;
    if (window._smsType === 'dual') {
        fd.append('code1', document.getElementById('code1').value);
        fd.append('code2', document.getElementById('code2').value);
        url = '/admin/login/dual-sms';
    } else {
        fd.append('sms_code', document.getElementById('smsCode').value);
        url = '/admin/login/sms';
    }
    
    const resp = await fetch(url, {method:'POST', headers:{'X-Requested-With':'XMLHttpRequest'}, body:fd});
    const d = await resp.json();
    
    if (d.status === 'ok') {
        window.location.href = d.redirect;
    } else {
        document.getElementById('smsError').textContent = d.message || '验证码错误';
        document.getElementById('smsError').style.display = 'block';
        btn.disabled = false; btn.textContent = '验证';
    }
}

function closeSms() {
    document.getElementById('smsModal').classList.remove('show');
    captchaImg.src = '/admin/captcha?'+Date.now();
}
</script>
{% endblock %}
