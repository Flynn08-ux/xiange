{% extends "base.html" %}{% block title %}管理员登录{% endblock %}{% block content %}
<div class="login-page"><h1 class="page-title">管理员登录</h1>
<form class="login-form" method="POST">
    <div class="form-group"><label>用户名</label><input type="text" name="username" required></div>
    <div class="form-group"><label>密码</label><input type="password" name="password" required></div>
    <div class="form-group"><label>安全密钥</label><input type="password" name="key" required placeholder="请输入密钥" maxlength="10" style="letter-spacing:4px;text-align:center;font-size:1.1rem"></div>
    <button type="submit" class="btn btn-primary btn-large" style="width:100%">登录</button>
</form>
<p class="login-hint">还不是管理员？<a href="/admin/apply">申请成为管理员</a></p>
</div>{% endblock %}
