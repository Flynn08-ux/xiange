{% extends "base.html" %}{% block title %}短信验证{% endblock %}{% block content %}
<div class="login-page"><h1 class="page-title">短信验证</h1>
<form class="login-form" method="POST">
    <p style="text-align:center;font-size:.9rem;color:var(--text2);margin-bottom:16px">短信验证码已发送到管理员手机</p>
    {% if test_code %}
    <div style="background:#f8f6ff;border:1px solid #e8e4ff;border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center;font-size:.9rem">
        测试验证码: <strong style="color:var(--primary);font-size:1.1rem">{{ test_code }}</strong>
    </div>
    {% endif %}
    <div class="form-group"><label>验证码</label><input type="text" name="sms_code" required placeholder="输入6位验证码" maxlength="6" style="font-size:1.2rem;letter-spacing:4px;text-align:center"></div>
    <button type="submit" class="btn btn-primary btn-large" style="width:100%">验证</button>
</form></div>{% endblock %}
