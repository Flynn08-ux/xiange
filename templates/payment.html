{% extends "base.html" %}{% block title %}付款{% endblock %}{% block content %}
<h1 class="page-title" style="text-align:center">扫码付款</h1>
<p style="text-align:center;color:var(--text2);margin-bottom:24px">选择支付方式，扫码支付后点击"我已付款"</p>
<div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;max-width:500px;margin:0 auto">
    <div style="text-align:center;padding:24px;border:2px solid #e8e4ed;border-radius:16px;width:200px;cursor:pointer"
         onclick="showPayment('alipay')">
        <div style="font-size:3rem;margin-bottom:8px">💙</div>
        <h3 style="color:#1677ff">支付宝</h3>
    </div>
    <div style="text-align:center;padding:24px;border:2px solid #e8e4ed;border-radius:16px;width:200px;cursor:pointer"
         onclick="showPayment('wechat')">
        <div style="font-size:3rem;margin-bottom:8px">💚</div>
        <h3 style="color:#07c160">微信支付</h3>
    </div>
</div>

<div id="qrModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center">
<div style="background:#fff;padding:32px;border-radius:16px;max-width:380px;width:90%;margin:15vh auto 0;text-align:center">
    <h2 id="qrTitle" style="margin-bottom:16px">扫码支付</h2>
    <img id="qrImg" src="" style="width:220px;height:220px;border:2px solid #e8e4ed;border-radius:12px;padding:8px;margin-bottom:16px">
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:16px">打开对应App扫码支付，完成后点下方按钮</p>
    <form method="POST" action="/payment/report">
        <input type="hidden" name="method" id="payMethod">
        <button type="submit" class="btn btn-primary btn-large" style="width:100%">✅ 我已付款</button>
    </form>
    <p style="margin-top:10px"><a href="#" onclick="document.getElementById('qrModal').style.display='none';return false">取消</a></p>
</div></div>

<script>
function showPayment(method){
    document.getElementById('qrModal').style.display = 'flex';
    document.getElementById('payMethod').value = method;
    if(method === 'alipay'){
        document.getElementById('qrTitle').textContent = '💙 支付宝扫码支付';
        document.getElementById('qrImg').src = '/static/qr_alipay.jpg';
    } else {
        document.getElementById('qrTitle').textContent = '💚 微信扫码支付';
        document.getElementById('qrImg').src = '/static/qr_wechat.jpg';
    }
}
</script>{% endblock %}
