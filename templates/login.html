{% extends "base.html" %}{% block title %}登录 — 弦歌{% endblock %}{% block content %}
<div class="login-page">
    <h1 class="page-title">登录</h1>
    <form class="login-form" method="POST">
        <div class="form-group"><label>用户名</label><input type="text" name="username" required placeholder="输入用户名"></div>
        <div class="form-group"><label>密码</label><input type="password" name="password" required placeholder="输入密码"></div>
        <button type="submit" class="btn btn-primary btn-large" style="width:100%">登录</button>
        <p class="login-hint">没有账号？<a href="/register">注册成为老师</a></p>
        <p class="login-hint"><a href="/forgot-password" style="color:var(--text2)">忘记密码？</a></p>
    </form>
</div>{% endblock %}
