{% extends "base.html" %}{% block content %}<table class="admin-table"><thead><tr><th>ID</th><th>家长</th><th>邮箱</th><th>学生</th><th>科目</th><th>逾期</th><th>时间</th><th>操作</th></tr></thead><tbody>{% for p in parents %}
        <tr><td colspan="9" style="display:none"></td></tr><tr><td>{{ p.id }}</td><td>{{ p.parent_name }}</td><td>{{ p.email }}</td><td>{{ p.student_name }}</td><td>{{ p.subjects[:20] }}</td><td>{{ p.late_count }}</td><td>{{ p.created_at[:10] }}</td>
            <td><a href="/admin/parent/{{ p.id }}/center" class="btn-small" style="background:var(--primary);color:#fff;border:none">查看</a>
            <form method="POST" action="/admin/parent/{{ p.id }}/delete" style="display:inline" onsubmit="return confirm('确认删除该家长？')">
                <button class="btn-small btn-danger">删除</button>
            </form>
            <form method="POST" action="/admin/blacklist/add" style="display:inline">
                <input type="hidden" name="user_type" value="parent">
                <input type="hidden" name="ref_id" value="{{ p.id }}">
                <input type="hidden" name="reason" value="管理员手动拉黑">
                <button class="btn-small" style="background:var(--error);color:#fff;border:none">拉黑</button>
            </form></td></tr>{% else %}<tr><td colspan="7" class="empty-cell">暂无</td></tr>{% endfor %}</tbody></table>{% endblock %}
