{% extends "base.html" %}{% block content %}<table class="admin-table"><thead><tr><th>ID</th><th>家长</th><th>邮箱</th><th>学生</th><th>科目</th><th>逾期</th><th>时间</th><th>操作</th></tr></thead><tbody>{% for p in parents %}
        <tr><td colspan="9" style="display:none"></td></tr><tr><td>{{ p.id }}</td><td>{{ p.parent_name }}</td><td>{{ p.email }}</td><td>{{ p.student_name }}</td><td>{{ p.subjects[:20] }}</td><td>{{ p.late_count }}</td><td>{{ p.created_at[:10] }}</td>
            <td><a href="/admin/parent/{{ p.id }}/center" class="btn-small" style="background:var(--primary);color:#fff;border:none">家校中心</a></td></tr>{% else %}<tr><td colspan="7" class="empty-cell">暂无</td></tr>{% endfor %}</tbody></table>{% endblock %}
