services:
  - type: web
    name: xiange
    runtime: python
    repo: https://github.com/Flynn08-ux/xiange
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class sync
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
    disk:
      name: sqlite-data
      mountPath: /tmp
      sizeGB: 1
